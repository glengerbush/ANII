# documentation: https://github.com/OWNER/REPO/blob/main/docs/deployment.md
# slogan: Daily planning with three priorities and optional local AI.
# category: Productivity
# tags: tasks,planning,ollama
# logo: assets/logo.svg
# port: 3000
# Self-service template: paste into Coolify's Docker Compose Empty resource.
# Set LIFE_IMAGE to a published version or digest; never use latest.
# Replace OWNER/REPO and the logo path before an official catalog submission.
services:
  app:
    image: ${LIFE_IMAGE:?Set LIFE_IMAGE to a published version or digest}
    environment:
      - SERVICE_URL_APP_3000
      - ORIGIN=${SERVICE_URL_APP_3000}
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - life-data:/data
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  life-data:
