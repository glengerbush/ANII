name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Stable release tag must be vMAJOR.MINOR.PATCH')
          version = tag[1:]
          with open('package.json') as handle:
              if json.load(handle)['version'] != version:
                  raise SystemExit('Release tag must match package.json version')
          with open('package-lock.json') as handle:
              lock = json.load(handle)
              if lock['version'] != version or lock['packages']['']['version'] != version:
                  raise SystemExit('Update package-lock.json version before releasing')
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'version={version}\nimage=ghcr.io/{os.environ["GITHUB_REPOSITORY"].lower()}\nrevision={revision}\n')
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing release image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION"; then
            echo 'This image version already exists. Publish a new release version.' >&2
            exit 1
          fi
      - name: Build and run app checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: life-management:release-check
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ steps.release.outputs.revision }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container startup, persistent data, backups, and exclusive access
        run: bash deploy/check-container.sh life-management:release-check
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker tag life-management:release-check "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          reference=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')
          {
            echo '### Ready for manual deployment'
            echo "Version: \`$IMAGE:$VERSION\`"
            echo "Pinned image: \`$reference\`"
            echo 'Set the version or digest in Coolify, then Redeploy. Nothing was deployed automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
